name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore PlanoOpenSpaceIT.Windows.csproj

      - shell: pwsh
        run: ./tools/verify.ps1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: dotnet test tests/PlanoOpenSpaceIT.Domain.Tests/PlanoOpenSpaceIT.Domain.Tests.csproj
      - run: find Resources/js -name '*.js' -print0 | xargs -0 -r -n1 node --check

  visual:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore PlanoOpenSpaceIT.Windows.csproj
      - run: python -m pip install -r tools/visual-requirements.txt
      - run: python -m playwright install chromium
      - run: dotnet build tests/PlanoOpenSpaceIT.Desktop.Tests/PlanoOpenSpaceIT.Desktop.Tests.csproj --no-restore
      - run: python tools/check-visual-fixtures.py
      - run: python tools/visual-regression.py

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: tests/visual-artifacts/
          if-no-files-found: warn
